[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glossodesy"
version = "0.1.0"
description = "Measure how close languages are: genealogically, lexically and geographically."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
glossodesy = "glossodesy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
